<head>
    <style> body { margin: 0; } </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="//unpkg.com/force-graph"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.15/lodash.min.js"></script>
  </head>
  
  <body>
    <div>
      <div class="row p-3 mb-2 bg-primary text-white">
        <h3>Red Agent Path Visualization</h1>
      </div>
    </div>
    <div class="row p-3 mb-2 bg-light">
      <div class="col-2">
        <button class="btn btn-primary" onClick=previous_game()>Previous Game</button>
      </div>
      <div class="col-2">
        <button class="btn btn-primary" onClick=previous_step()>Previous Step</button>
      </div>
      <div class="col-1">
        <span>Current Game: <a id="games">1</a></span>
      </div>
      <div class="col-2">
        <span>Current Step: <a id="steps">0</a> - <a id="action"> </a></span>
      </div>
      <div class="col-2">
        <button class="btn btn-primary" onClick=next_step()>Next Step</button>
      </div>     
      <div class="col-2">
        <button class="btn btn-primary" onClick=next_game()>Next Game</button>
      </div>     
      <div class="col-1">
        <button class="btn btn-primary" onClick=reset()>Reset</button>
      </div>     
    </div>
    <div id="graph"></div>
    
  
    <script>
      var localData = {"nodes":[], "links":[]}

      const drawNode = (node, ctx) => {
        if (node.discovered == true) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 12, 5, 9 * Math.PI, false);
        ctx.lineWidth = 2
        ctx.strokeStyle = "gray"
        ctx.stroke();
        }
        if (node.privilege == 'Privileged') {
          ctx.beginPath();
          ctx.arc(node.x, node.y, 12, 5, 9 * Math.PI, false);
          ctx.lineWidth = 2
          ctx.strokeStyle = "red"
          ctx.stroke();
        }
        if (node.privilege == 'User') {
          ctx.beginPath();
          ctx.arc(node.x, node.y, 12, 5, 9 * Math.PI, false);
          ctx.lineWidth = 2
          ctx.strokeStyle = "yellow"
          ctx.stroke();
        }
        let label = node.id
        const fontSize = 6
        ctx.font = `${fontSize}px "Montserrat", Helvetica, Arial, serif`
        const textWidth = ctx.measureText(label).width
        const bckgDimensions = [textWidth, fontSize].map(
          (n) => n + (fontSize * 0.5)
        ) // some padding

        // Node label
        ctx.textAlign = "center"
        ctx.textBaseline = "middle"
        ctx.fillStyle = "black"
        ctx.fillText(label, node.x, node.y)
        ctx.fillStyle
      }

      function reset() {
        fetch('api/reset').then(res => res.json()).then(newdata => {
          document.getElementById("steps").innerHTML = newdata['step']
          document.getElementById("games").innerHTML = newdata['game']
          document.getElementById("action").innerHTML = newdata['action']
          localData['nodes'] = newdata['nodes']
          localData['links'] = newdata['links']
          document.getElementById('blueScoreTotal').innerHTML = "0.0"
          document.getElementById('redScoreTotal').innerHTML = "0.0"
          document.getElementById("actionBlue").innerHTML = ""
          document.getElementById("actionRed").innerHTML = ""

          const elem = document.getElementById('graph');
          const Graph = ForceGraph()(elem)
            .linkDirectionalParticles('animation')
            .linkDirectionalParticleSpeed('animation_speed')
            .graphData(localData)
            .height(800)
            .nodeId('id')
            .nodeVal(5)
            .nodeLabel('label')
            .linkColor('color')
            .nodeAutoColorBy('group')
            .linkSource('source')
            .linkTarget('target')
            .linkWidth(4)
            .linkLineDash(link => link.dashed && [4, 4])
            .nodeCanvasObjectMode(() => "after")
            .nodeCanvasObject(drawNode);
                });
      }

      function next_step() {
        fetch('api/next_step').then(res => res.json()).then(newdata => {
          document.getElementById("steps").innerHTML = newdata['step']
          document.getElementById("action").innerHTML = newdata['action']

          localData['nodes'] = newdata['nodes']
          localData['links'] = newdata['links']
          
          const elem = document.getElementById('graph');
          const Graph = ForceGraph()(elem)
            .linkDirectionalParticles('animation')
            .linkDirectionalParticleSpeed('animation_speed')
            .graphData(localData)
            .height(800)
            .nodeId('id')
            .nodeVal(5)
            .nodeLabel('label')
            .linkColor('color')
            .nodeAutoColorBy('group')
            .linkSource('source')
            .linkTarget('target')
            .linkWidth(4)
            .linkLineDash(link => link.dashed && [4, 4])
            .nodeCanvasObjectMode(() => "after")
            .nodeCanvasObject(drawNode);
                });
      }

      function previous_step() {
        fetch('api/previous_step').then(res => res.json()).then(newdata => {
          document.getElementById("games").innerHTML = newdata['game']
          document.getElementById("steps").innerHTML = newdata['step']
          document.getElementById("action").innerHTML = newdata['action']

          localData['nodes'] = newdata['nodes']
          localData['links'] = newdata['links']
          
          const elem = document.getElementById('graph');
          const Graph = ForceGraph()(elem)
          .linkDirectionalParticles('animation')
            .graphData(localData)
            .height(800)
            .nodeId('id')
            .nodeVal(5)
            .nodeLabel('label')
            .linkColor('color')
            .nodeAutoColorBy('group')
            .linkSource('source')
            .linkTarget('target')
            .linkWidth(4)
            .linkLineDash(link => link.dashed && [2, 2])
            .nodeCanvasObjectMode(() => "after")
            .nodeCanvasObject(drawNode);
                });
          }

      function next_game() {
        fetch('api/next_game').then(res => res.json()).then(newdata => {
          document.getElementById("games").innerHTML = newdata['game']
          document.getElementById("steps").innerHTML = newdata['step']
          document.getElementById("action").innerHTML = newdata['action']

          localData['nodes'] = newdata['nodes']
          localData['links'] = newdata['links']
          
          const elem = document.getElementById('graph');
          const Graph = ForceGraph()(elem)
            .linkDirectionalParticles('animation')
            .linkDirectionalParticleSpeed('animation_speed')
            .graphData(localData)
            .height(800)
            .nodeId('id')
            .nodeVal(5)
            .nodeLabel('label')
            .linkColor('color')
            .nodeAutoColorBy('group')
            .linkSource('source')
            .linkTarget('target')
            .linkWidth(4)
            .linkLineDash(link => link.dashed && [4, 4])
            .nodeCanvasObjectMode(() => "after")
            .nodeCanvasObject(drawNode);
                });
      }

      function previous_game() {
        fetch('api/previous_game').then(res => res.json()).then(newdata => {
          document.getElementById("games").innerHTML = newdata['game']
          document.getElementById("steps").innerHTML = newdata['step']
          document.getElementById("action").innerHTML = newdata['action']

          localData['nodes'] = newdata['nodes']
          localData['links'] = newdata['links']
          
          const elem = document.getElementById('graph');
          const Graph = ForceGraph()(elem)
          .linkDirectionalParticles('animation')
            .graphData(localData)
            .height(800)
            .nodeId('id')
            .nodeVal(5)
            .nodeLabel('label')
            .linkColor('color')
            .nodeAutoColorBy('group')
            .linkSource('source')
            .linkTarget('target')
            .linkWidth(4)
            .linkLineDash(link => link.dashed && [2, 2])
            .nodeCanvasObjectMode(() => "after")
            .nodeCanvasObject(drawNode);
                });
          }


</script>
  </body>
